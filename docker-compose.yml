services:
  jiddu-db:
    image: postgres:16-alpine
    container_name: jiddu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jiddu
      POSTGRES_USER: jiddu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: --data-checksums
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiddu -d jiddu"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - jiddu_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - jiddu-internal

  jiddu-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jiddu-app
    container_name: jiddu-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://jiddu:${POSTGRES_PASSWORD}@jiddu-db:5432/jiddu
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - TZ=America/Sao_Paulo
    depends_on:
      jiddu-db:
        condition: service_healthy
    volumes:
      # Temporary read-only mount used for the one-time SQLite import. The
      # volume is retained for rollback after this mount is removed.
      - jiddu_data:/app/sqlite-data:ro
    networks:
      - proxy-network
      - jiddu-internal

volumes:
  jiddu_data:
  jiddu_postgres_data:

networks:
  proxy-network:
    external: true
  jiddu-internal:
    internal: true
