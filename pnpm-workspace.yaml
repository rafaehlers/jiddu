# The Next.js app (root) plus the standalone MCP server package. The MCP
# package has its own deps/lockfile and is built separately from source; the
# Docker image (npm ci, root package-lock.json) never builds it.
packages:
  - "."
  - "packages/*"

# Native dependencies allowed to run install/build scripts. pnpm blocks
# these by default (supply-chain hardening); we opt them in explicitly so
# `pnpm install` doesn't abort with ERR_PNPM_IGNORED_BUILDS.
onlyBuiltDependencies:
  - '@prisma/engines'
  - better-sqlite3
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
