# Native dependencies allowed to run install/build scripts. pnpm blocks
# these by default (supply-chain hardening); we opt them in explicitly so
# `pnpm install` doesn't abort with ERR_PNPM_IGNORED_BUILDS.
onlyBuiltDependencies:
  - '@prisma/engines'
  - better-sqlite3
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
