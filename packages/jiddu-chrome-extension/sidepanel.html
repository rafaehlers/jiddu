<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jiddu — Critical Reading</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">J</div>
      <div class="brand-copy">
        <span>JIDDU</span>
        <strong data-i18n="header.subtitle">Critical reading</strong>
      </div>
      <button id="settingsButton" class="icon-button" type="button" aria-label="Settings" title="Settings" data-i18n-aria-label="actions.settings" data-i18n-title="actions.settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1-1.55V3h4v.08A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.55 1H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"></path>
        </svg>
      </button>
    </header>

    <main id="app" aria-live="polite"></main>

    <footer class="app-footer">
      <span data-i18n="footer.disclaimer">Jiddu can be wrong. Check the findings and sources.</span>
      <a href="https://jiddu.app" target="_blank" rel="noreferrer">jiddu.app</a>
    </footer>

    <dialog id="settingsDialog">
      <form id="settingsForm" method="dialog">
        <header class="dialog-header">
          <div>
            <span class="eyebrow" data-i18n="settings.eyebrow">SETTINGS</span>
            <h2 data-i18n="settings.title">Connect to Jiddu</h2>
          </div>
          <button id="closeSettingsButton" class="icon-button" type="button" aria-label="Close" data-i18n-aria-label="settings.close">×</button>
        </header>

        <label class="field">
          <span data-i18n="settings.apiKey">API key</span>
          <input id="apiKeyInput" name="apiKey" type="password" autocomplete="off" placeholder="jdk_…" />
          <small data-i18n="settings.apiKeyHint">The key is stored only in this Chrome installation.</small>
        </label>

        <label class="field">
          <span data-i18n="settings.interfaceLanguage">Interface language</span>
          <select id="uiLangInput" name="uiLang">
            <option value="en">English</option>
            <option value="pt">Português</option>
            <option value="es">Español</option>
          </select>
        </label>

        <label class="field">
          <span data-i18n="settings.explanationLanguage">Explanation language</span>
          <select id="langInput" name="lang">
            <option value="en">English</option>
            <option value="pt">Português</option>
            <option value="es">Español</option>
          </select>
        </label>

        <details class="advanced-settings">
          <summary data-i18n="settings.localDevelopment">Local development</summary>
          <label class="field">
            <span data-i18n="settings.apiServer">API server</span>
            <select id="apiBaseInput" name="apiBase">
              <option value="https://jiddu.app">https://jiddu.app</option>
              <option value="http://localhost:3000">http://localhost:3000</option>
              <option value="http://127.0.0.1:3000">http://127.0.0.1:3000</option>
            </select>
          </label>
        </details>

        <div id="settingsFeedback" class="settings-feedback" role="status"></div>

        <div class="dialog-actions">
          <a href="https://jiddu.app/account?tab=api" target="_blank" rel="noreferrer" data-i18n="settings.apiLink">Create or manage API keys</a>
          <button class="primary-button" type="submit" data-i18n="settings.save">Save connection</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
